syntax = "proto3";

package product.v1;

import "google/api/annotations.proto";

option go_package = "kratos-demo/gen/product/v1;v1";

// The greeting service definition.
service Product {
  rpc Banner (BannerRequest) returns (BannerReply) {
    option (google.api.http) = {
      get: "/saas-bond-product-api/v1/product/banner"
    };
  }
}

// The request message containing the user's name.
message BannerRequest {
}

// The response message containing the greetings
message BannerReply {
  int32 total = 1;
  int32 count = 2;
  int32 start = 3;
  repeated BondItem list = 4;
}

message BondItem {
  int32 id = 1;
  string product_id = 2;
  string symbol = 3;
  string isin = 4;
  string name = 5;
  string name_en = 6;
  int32 issuer_type = 7;
  int32 status = 8;
  string currency = 9;
  string mid_yield = 10;           // 收益率用 string 避免浮点精度问题
  string min_buy_amount = 11;      // 金额也建议 string
  string bond_rating = 12;
  string bond_sp_rating = 13;
  string bond_moody_rating = 14;
  string bond_fitch_rating = 15;
  int32 remain_year = 16;
  int32 remain_days = 17;
  string issuer = 18;
}
